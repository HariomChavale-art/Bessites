<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Bessites Pro!</title>
    <style>
        body {
            background-color: #0B0A0F;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #12111A;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4rem;
            border-radius: 3rem;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; font-size: 2.5rem; margin-bottom: 1.5rem; }
        p { color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 2rem; font-weight: 500; }
        .highlight { color: #7B33FF; font-weight: 900; }
        .btn {
            display: inline-block;
            background: white;
            color: black;
            padding: 1rem 2rem;
            border-radius: 1rem;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to <span class="highlight">Bessites Pro!</span></h1>
        <p>
            Payment successful! Please <span class="highlight">check your email</span> for a message from Gumroad containing your unique license key.
        </p>
        <p>
            Copy that key and paste it into the activation box on Bessites to unlock your access.
        </p>
        <a href="/" class="btn">Back to Bessites</a>
        <p style="margin-top: 2rem; font-size: 0.8rem; opacity: 0.4;">
            Questions? bessitesofficial@gmail.com
        </p>
    </div>
</body>
</html>
